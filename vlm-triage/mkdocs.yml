site_name: vlm-triage 文档
site_author: luonairui
site_description: 基于视觉-语言模型（VLM）的自动驾驶路测问题切面化排查与分析工具集
repo_name: luonairui/vlm-triage
repo_url: https://git.xiaojukeji.com/luonairui/vlm-triage
edit_uri: tree/master/docs/

docs_dir: docs
site_dir: data/vlm-triage-docs

# exclude_docs: |
#   test.*

draft_docs: |
  drafts/

watch: ["apps", "lib", "models", "scripts", "tests"]

plugins:
  - autorefs:
      resolve_closest: true
  - search:
      lang:
        - zh
        - en
  - gen-files:
      scripts:
        - scripts/gen-ref-pages.py
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: auto
            allow_inspection: false
            backlinks: tree  # Sponsors only!
            docstring_section_style: table
            group_by_category: true
            heading_level: 1
            inherited_members: false
            line_length: 100
            members_order: source
            merge_init_into_class: true
            overloads_only: true
            parameter_headings: true
            separate_signature: true
            show_bases: false
            show_inheritance_diagram: true  # Sponsors only!
            show_labels: true
            show_root_full_path: false
            show_root_heading: true
            show_root_members_full_path: false
            show_root_toc_entry: true
            show_signature_annotations: true
            show_signature_type_parameters: true
            show_source: true
            show_submodules: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true
            type_parameter_headings: true
            unwrap_annotated: true
            extensions:
              - griffe_pydantic: {schema: true}
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      default_lang: python
      line_spans: __span
      linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - smarty
  - toc:
      permalink: true
      toc_depth: 3

theme:
  name: material
  language: zh
  palette:
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - content.code.annotate
    - content.code.copy
    - header.autohide
    - navigation.expand
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

nav:
