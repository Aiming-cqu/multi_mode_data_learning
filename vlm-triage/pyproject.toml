dev-full = {features = ["dev", "dev-extras", "notebook", "test"], solve-group = "default"}
prod = {features = [], solve-group = "default"}
voyager = {features = ["voyager"], solve-group = "voyager", no-default-feature = true}
voyager-dev = {features = ["voyager", "dev", "test", "test-extras"], solve-group = "voyager", no-default-feature = true}
vllm-base = {features = ["vllm-base"], solve-group = "vllm", no-default-feature = true}
vllm-latest = {features = ["vllm-build"], no-default-feature = true}
vllm = {features = ["vllm-base", "vllm-extras", "dev", "test", "test-extras"], solve-group = "vllm", no-default-feature = true}
opencv = {features = ["opencv", "dev", "test"], solve-group = "opencv", no-default-feature = true}
hadoop = {features = ["hadoop", "dev", "test"], no-default-feature = true}
fastdeploy = {features = ["fastdeploy"], no-default-feature = true}
fawltydeps = {features = ["fawltydeps"], no-default-feature = true}
litellm = {features = ["litellm"], no-default-feature = true}
mkdocs = {features = ["mkdocs"], no-default-feature = true}
modelscope = {features = ["modelscope"], no-default-feature = true}
pipreqs = {features = ["pipreqs"], no-default-feature = true}

[tool.pyright]
ignore = ["reportDeprecated"]

[tool.pytest.ini_options]
addopts = ["--continue-on-collection-errors", "--doctest-modules", "--doctest-continue-on-failure"]
# anyio_mode = "auto"
asyncio_debug = true
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
asyncio_mode = "auto"
# doctest_optionflags = []
log_level = "INFO"
logfire = true
testpaths = ["apps", "lib", "models", "tests"]
markers = [
    "smoke: 冒烟测试 — 最快路径验证 API 通断",
    "functional: 功能测试 — 各模块正常功能验证",
    "coverage: 覆盖测试 — 边角情况/错误路径/边界值",
    "stress: 压力测试 — 并发/稳定性验证",
    "resource: 资源密集测试 — 捕获耗时/RSS/GPU 内存报告",
]

[tool.coverage.paths]
source = ["apps", "lib", "models"]

[tool.coverage.report]
exclude_lines = [
    # 标准的排除标记
    "pragma: no cover",

    # 排除入口保护块
    "if __name__ == .__main__.:",

    # 排除类型检查时的导入（运行时不执行）
    "if TYPE_CHECKING:",

    # 排除抽象方法（没有实现逻辑）
    "@(abc\\.)?abstractmethod",

    # 排除防御性断言（通常是永远不会发生的错误）
    "raise AssertionError",
    "raise NotImplementedError",

    # 排除协议/接口定义
    "class .*\\bProtocol\\):",
    "@(.*\\.)?runtime_checkable",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ANN", "B", "COM", "E", "F", "Q"]
ignore = ["ANN201", "ANN202", "ANN204", "ANN401", "B008", "B013", "E401", "E402", "E701", "E731"]

allowed-confusables = ["l"]
flake8-type-checking.quote-annotations = true
# isort.lines-after-imports = 2

[tool.ruff.lint.flake8-quotes]
avoid-escape = true
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.format]
docstring-code-format = true
quote-style = "preserve"

[tool.ty.rules]
all = "warn"

implicit-any = "error"
missing-annotations = "warn"
report-unknown-member-types = "warn"
report-unknown-parameter-type = "warn"
report-unknown-return-type = "warn"
report-unknown-variable-type = "warn"
unknown-type = "error"
# unresolved-reference = "warn"
