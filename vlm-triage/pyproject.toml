[pycodestyle]
# E501 reports lines that exceed the length of 100.
max-line-length = 120

# [tool.setuptools]
# packages = []  # NOTE: use flat-layout

[tool.pixi.workspace]
platforms = ["linux-64", "osx-arm64"]
channels = ["https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge", "conda-forge"]

[tool.pixi.dependencies]
async-lru = "*"
fastapi = "*"
ffmpeg = ">=7"
httpx = "*"
logfire = "*"
mcp = "*"
miniopy-async = "*"
nest-asyncio = "*"
numpy = "*"
openai = "*"
openpyxl = "*"
opentelemetry-instrumentation-aiohttp-client = "*"
opentelemetry-instrumentation-fastapi = "*"
opentelemetry-instrumentation-httpx = "*"
opentelemetry-instrumentation-system-metrics = "*"
pandas = "*"
pillow = "*"
pyarrow = "*"
pydantic = ">=2.12" # >=2.13.0
pydantic-ai = ">=0.4.9"
rich = "<15"
streamlit = ">=1.47"
tenacity = "*"
tqdm = "*"
typer = "*"
typing-extensions = ">=4.12.2"
uvicorn = "*"
xlsxwriter = "*"

[tool.pixi.pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
# no-binary = ["vlm-triage"]
no-build = true

# [tool.pixi.pypi-dependencies]
# vlm-triage = {path = ".", editable = true}
# openlit = "*"

[tool.pixi.activation]
scripts = [
    "scripts/activation/pre-pixi.sh",
    "scripts/activation/local.sh",
    "scripts/activation/default.sh",
]

[tool.pixi.tasks]
cleanup-cache = "rm -r cache/* || true"
cleanup-logs = "rm -r logs/* || true"
cleanup-py = "find . \\( -name '*.egg-info' -o -name '*.pyc' -o -name '__pycache__' -o -name '.DS_Store' \\) -delete || true"
cleanup = [{task = "cleanup-py"}, {task = "cleanup-cache"}, {task = "cleanup-logs"}]
make-py-exec = "find apps/ lib/ models/ tests/ -name '*.py' | xargs grep -l '#!/usr/bin/env -S pixi run' | xargs chmod a+x"
make-sh-exec = "find scripts/ -name '*.sh' | xargs grep -l '#!/usr/bin/env -S pixi run' | xargs chmod a+x"
make-exec = [{task = "make-py-exec"}, {task = "make-sh-exec"}]
cooper-cli = "python -m lib.platforms.ep.cooper"
cooper-read = {cmd = "python -m lib.platforms.ep.cooper export --url '{{ url }}' | python -m lib.platforms.ep.cooper normalize-docx | pixi exec markitdown", args = ["url"]}
s3-cli = "python -m lib.utils.s3_utils"
serve-fe = 'streamlit run --server.headless true --server.port "$TRIAGE_FE_PORT" --browser.gatherUsageStats false'

[tool.pixi.feature.dev.dependencies]
curl = "*"
ipython = "*"
jq = "*"
# mypy = "*"
py-spy = "*"
ruff = "*"
ty = "*"

[tool.pixi.feature.dev.activation.env]
OTEL_ENVIRONMENT_NAME = "dev"

[tool.pixi.feature.dev.tasks]
exp = "python -m lib.utils.experiments"
format = "ruff format"
ipyf = "ipython --pdb -i"
ipym = {cmd = 'ipython --pdb -i -m "{{ module }}" --', args = ["module"]}
ipyp = {cmd = 'ipython --pdb -i -m "$(scripts/path2module.sh "{{ path }}")" --', args = ["path"]}
ipyx = "kill %%; clear; ipython --pdb -i"
ipyy = {cmd = 'kill %%; clear; ipython --pdb -i -m "{{ module }}" --', args = ["module"]}
ipyz = {cmd = 'kill %%; clear; ipython --pdb -i -m "$(scripts/path2module.sh "{{ path }}")" --', args = ["path"]}
lint-dcl = "clear; dcl lint"
lint-ruff = "clear; ruff check"
lint-ty = "clear; ty check"

[tool.pixi.feature.dev-extras.dependencies]
nodejs = "*"
opentelemetry-sdk = "*"
pnpm = "*"
typescript = "*"

[tool.pixi.feature.dev-extras.tasks]
codex = {cmd = "npx -y @openai/codex", env = {HTTPS_PROXY = "localhost:1080"}}
codexp = "npx -y @openai/codex -p"
copilot = "npx -y @github/copilot --experimental --log-level info --log-dir logs/"
copilot-agent = {cmd = "npx -y @github/copilot --experimental --log-level info --log-dir logs/", env = {COPILOT_PROVIDER_BASE_URL = "$TRIAGE_MODEL_ROUTER_URL", COPILOT_PROVIDER_MODEL_ID = "#AgentModel"}}
copilot-coder = {cmd = "npx -y @github/copilot --experimental --log-level info --log-dir logs/", env = {COPILOT_PROVIDER_BASE_URL = "$TRIAGE_MODEL_ROUTER_URL", COPILOT_PROVIDER_MODEL_ID = "#CoderModel"}}
copilot-auto = "npx -y @github/copilot --experimental --log-level info --log-dir logs/ --model auto --effort high --enable-reasoning-summaries"
copilot-gpt = "npx -y @github/copilot --experimental --log-level info --log-dir logs/ --model gpt-5.4 --effort high --enable-reasoning-summaries"
copilot-haiku = {cmd = "npx -y @github/copilot --experimental --log-level info --log-dir logs/ --model claude-haiku-4.5", env = {HTTPS_PROXY = "localhost:1080"}}
copilot-sonnet = {cmd = "npx -y @github/copilot --experimental --log-level info --log-dir logs/ --model claude-sonnet-4.6 --effort high", env = {HTTPS_PROXY = "localhost:1080"}}
copilot-opus = {cmd = "npx -y @github/copilot --experimental --log-level info --log-dir logs/ --model claude-opus-4.6 --effort high", env = {HTTPS_PROXY = "localhost:1080"}}

[tool.pixi.feature.test.dependencies]
curl = "*"
ipython = "*"
jq = "*"
psutil = "*"
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"

[tool.pixi.feature.test.activation.env]
OTEL_ENVIRONMENT_NAME = "test"

[tool.pixi.feature.test.tasks]
test = 'pytest --cov="$PROJECT_ROOT" --cov-append --cov-branch --cov-report='
testm = 'python -m pytest --cov="$PROJECT_ROOT" --cov-append --cov-branch --cov-report= --pyargs'
testp = {cmd = 'python -m pytest --cov="$PROJECT_ROOT" --cov-append --cov-branch --cov-report= --pyargs "$(scripts/path2module.sh "{{ path }}")"', args = ["path"]}
pdbtest = "kill %%; clear; pytest --pdb --pdbcls=IPython.terminal.debugger:TerminalPdb --verbosity=1"
pdbtestm = "kill %%; clear; python -m pytest --pdb --pdbcls=IPython.terminal.debugger:TerminalPdb --verbosity=1 --pyargs"
pdbtestp = {cmd = 'kill %%; clear; python -m pytest --pdb --pdbcls=IPython.terminal.debugger:TerminalPdb --verbosity=1 --pyargs "$(scripts/path2module.sh "{{ path }}")"', args = ["path"]}
coverase = "coverage erase"
covcombine = "coverage combine"
covreport = "coverage report"
covxml = "coverage xml -o coverage.xml"
covhtml = "coverage html -d htmlcov/"
cov = [{task = "coverase"}, {task = "etest"}, {task = "covcombine"}, {task = "covreport"}, {task = "covxml"}]

[tool.pixi.feature.test.tasks.etest]
cmd = "clear; find apps/ lib/ models/ tests/ -name '*.py' | xargs grep -El '#!/usr/bin/env -S pixi run .*\\btest\\b' | /usr/bin/xargs -L1 sh -c"
depends-on = ["make-py-exec"]

